
<svg xmlns="http://www.w3.org/2000/svg"
     width="100"
     height="112"
     viewBox="0 0 100 112"
     role="img"
     aria-labelledby="logoTitle logoDescription">

  <title id="logoTitle">CampusFind Logo</title>

  <desc id="logoDescription">
    A green location pin with a checkmark representing
    lost belongings being found.
  </desc>

  <!-- Original CampusFind location pin -->
  <path
    d="M50 5
       C25.15 5 5 25.15 5 50
       C5 81 50 107 50 107
       S95 81 95 50
       C95 25.15 74.85 5 50 5Z"
    fill="#174E43"
  />

  <!-- Light green inner circle -->
  <circle
    cx="50"
    cy="49"
    r="29"
    fill="#DDF6E9"
  />

  <!-- Checkmark indicating a found item -->
  <path
    d="M35 49 L46 60 L67 37"
    fill="none"
    stroke="#174E43"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

</svg>
